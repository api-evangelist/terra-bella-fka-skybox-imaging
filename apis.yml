name: Terra Bella (fka Skybox Imaging)
description: 'Terra Bella, originally founded in 2009 as Skybox Imaging (Mountain View, California), was a
  satellite imaging and geospatial analytics company that built and operated the SkySat constellation of
  high-resolution Earth-observation satellites. Google acquired Skybox Imaging in 2014 for roughly $500
  million and rebranded it Terra Bella. In 2017 Alphabet/Google sold Terra Bella and its SkySat satellites
  to Planet Labs, folding the business into Planet''s Earth-observation operations. Terra Bella no longer
  exists as an independent operating entity and publishes no independent developer portal, API, or SDK
  surface; its capabilities live on inside Planet Labs. Surfaced as a portfolio company of
  bessemer-venture-partners.'
